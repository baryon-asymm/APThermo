name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} — build & test
    runs-on: ${{ matrix.os }}
    env:
      # Job-local, so a run never restores a package a previous run or another job left in a shared
      # NuGet cache: the freshly packed APThermo must be the one every restore in this job sees.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # First diagnostic step this job can run: the CPU/core-count half needs no SDK, but the ISA half
      # (tests/Harness's per-case field dump, root BOOT.md's platform constraint) does, so this sits right after
      # "Setup .NET SDK" rather than before it — the earliest point where both halves are meaningful.
      - name: Runner diagnostics
        uses: ./.github/actions/runner-diagnostics
        with:
          dotnet-available: 'true'

      - name: Setup Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Protocol lint
        run: python -X utf8 tools/protocol-lint/protocol_lint.py . --exclude templates

      # The fixtures' provenance hashes bind an output to the scripts that produced it, never to the reference
      # package's own answer (tests/Fixtures/ACCEPTANCE.md, "The outputs are bound to the generator"): a hand-edited
      # expected value passes every other guard. This step regenerates a sample with the pinned `cea` package in a
      # fresh virtual environment and compares each regenerated case with the committed file as a document, field
      # by field, not as text (`regenerate.py --check --sample`, tests/Fixtures/ACCEPTANCE.md, "The binding step runs on
      # the fixtures' own platform and compares with a tolerance"): the same keys in the same order, strings,
      # booleans and null equal, numbers within 1e-9 relative, the `throat` kind's search-derived numbers within the
      # `throat` row of tests/Fixtures/tolerances.json, the provenance keys generatedOn, thermoLibSha256 and
      # transLibSha256 left out. It fails the job on any difference, and on any (script, kind) pair the sample
      # intended to cover comparing nothing at all (tests/Fixtures/ACCEPTANCE.md, the third audit pass's finding 4c).
      # Windows only: the committed fixtures are the Windows package's, `cea` builds its data libraries per platform
      # and on Linux aborts on the near-singular salt states and moves the throat family by up to 2.2e-5, so the
      # step runs on the fixtures' own platform (a hosted CPU may differ from the reference machine's, which the
      # tolerance absorbs; plain `regenerate.py --check` compares exact text on the reference machine).
      - name: Fixtures are bound to the generator
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          python -m venv .venv-fixtures
          .venv-fixtures/Scripts/python -m pip install --disable-pip-version-check -r tests/Fixtures/generate/requirements.txt
          .venv-fixtures/Scripts/python tests/Fixtures/generate/regenerate.py --check --sample

      - name: Build
        run: dotnet build APThermo.sln --configuration Release

      # The bit snapshots run here too (2026-10-05, root BOOT.md's platform constraint): the tree's own Exp, Log and
      # Pow read nothing of the runner's C runtime, so the one record per node holds on every CPU.
      - name: Fast test suite
        env:
          APTHERMO_NO_CUDA: '1'
        run: dotnet test APThermo.sln --configuration Release --no-build --filter "Category!=LongRunning"

      # Every *.actual.txt (a mismatched or missing bit-snapshot key) and its *.fields.txt per-case field dump
      # (tests/Harness/BOOT.md, "a field dump is a caller's opt-in"), whenever the fast suite above failed: the CPU
      # model, core count and ISA facts of the step above name the hardware and runtime that produced them.
      - name: Upload bit-snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bit-snapshot-diagnostics-${{ matrix.os }}
          path: |
            **/*.actual.txt
            **/*.actual.json
            **/*.fields.txt
          if-no-files-found: ignore

      - name: Determine the package version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild src/Problems/APThermo.Problems.csproj -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack both packages
        shell: bash
        run: |
          dotnet pack src/Problems/APThermo.Problems.csproj --configuration Release -p:ContinuousIntegrationBuild=true --output artifacts/packages
          dotnet pack src/Cli/APThermo.Cli.csproj --configuration Release -p:ContinuousIntegrationBuild=true --output artifacts/packages

      - name: Samples run against the packaged library
        shell: bash
        run: |
          set -euo pipefail

          # Every scenario, read from the samples node's own table (samples/Samples/API.md,
          # ## Scenarios) rather than typed into this workflow: the scenario name in column 2, the
          # approved output file in column 5, of every row that names a scenario. A row count of
          # zero (the table's heading renamed or removed) must fail loudly rather than let the loop
          # below run zero times and report success (ScenarioTableTests proves the table itself
          # matches the code; this guards the workflow's own parse of it).
          scenario_count=0
          while IFS=':' read -r scenario approved; do
            scenario_count=$((scenario_count + 1))
            echo "-- $scenario --"
            dotnet run --project samples/Samples --configuration Release \
              -p:APThermoPackageVersion="${{ steps.version.outputs.version }}" \
              -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/packages" \
              -- "$scenario" | tr -d '\r' > actual-sample.txt
            diff actual-sample.txt "tests/Docs.Tests/approved/samples/$approved"
          done < <(awk -F'|' '/^\| `/{gsub(/[ `]/,"",$2); gsub(/[ `]/,"",$6); print $2":"$6}' samples/Samples/API.md)

          if [ "$scenario_count" -eq 0 ]; then
            echo "no scenario row was parsed from samples/Samples/API.md" >&2
            exit 1
          fi

      - name: Install the packed tool and run an approved example
        shell: bash
        run: |
          dotnet tool install APThermo.Cli --tool-path .tool --add-source artifacts/packages --version "${{ steps.version.outputs.version }}"

          # The scratch program inherits the root's Directory.Build.props, so it builds under the Diagnostics
          # constraint (root BOOT.md): it references the Harness library instead of compiling RunPropertyCut.cs and
          # JsonFieldComparison.cs into itself, because a public type inside an executable is CA1515; TargetFramework
          # and Nullable come from the root. It cuts the `run` property, compares the rest field by field with the
          # approved document (args: delivered document, example name, approved document) and exits 1 naming the first
          # difference on stderr.
          mkdir -p .ci/run-cut
          cat > .ci/run-cut/RunCut.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../tests/Harness/APThermo.Harness.csproj" />
            </ItemGroup>
          </Project>
          EOF
          cat > .ci/run-cut/Program.cs <<'EOF'
          using System.Text.Json;
          using APThermo.Harness;

          var cut = RunPropertyCut.Bytes(File.ReadAllBytes(args[0]), args[1]);
          using var actual = JsonDocument.Parse(cut);
          using var approved = JsonDocument.Parse(File.ReadAllBytes(args[2]));
          var mismatch = JsonFieldComparison.Mismatch(approved.RootElement, actual.RootElement, "$");
          if (mismatch is not null)
          {
              Console.Error.WriteLine(mismatch);
              return 1;
          }

          return 0;
          EOF

          PATH="$PWD/.tool:$PATH" apthermo rocket samples/cli/problems/rocket.json --accelerator cpu > actual-rocket.json

          # Field by field, numbers within 1e-9 relative (.github/BOOT.md, Continuous integration), against the one
          # approved record of every platform: this step proves the packed tool runs and delivers the document, while
          # the exact byte comparison is the Category=BitSnapshot facts of the docs tests node, which the fast suite
          # above runs on this runner (2026-10-05).
          dotnet run --project .ci/run-cut --configuration Release -- "$PWD/actual-rocket.json" rocket "$PWD/tests/Docs.Tests/approved/cli/rocket.approved.json"

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
