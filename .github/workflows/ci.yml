name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} — build & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Protocol lint
        run: python tools/protocol-lint/protocol_lint.py --exclude templates .

      - name: Build
        run: dotnet build APThermo.sln --configuration Release

      - name: Fast test suite
        env:
          APTHERMO_NO_CUDA: '1'
        run: dotnet test APThermo.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Problems/APThermo.Problems.csproj --configuration Release --output artifacts/packages

      - name: Samples run
        run: dotnet run --project samples/Samples --configuration Release -- rocket
