name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Tag and CHANGELOG check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Determine the package version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild src/Problems/APThermo.Problems.csproj -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the tag and extract the release notes
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ref_name=""
          if [ "$RELEASE_EVENT_NAME" = "push" ]; then
            ref_name="$RELEASE_REF_NAME"
          fi
          bash .github/scripts/check-release.sh "$RELEASE_VERSION" CHANGELOG.md release-notes.md "$ref_name"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  matrix:
    name: ${{ matrix.os }} — build & test
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Protocol lint
        run: python -X utf8 tools/protocol-lint/protocol_lint.py . --exclude templates --strict

      - name: Delivery guard tests
        run: python -X utf8 .github/scripts/test_delivery.py

      - name: Trace runner guard tests
        run: python -X utf8 .github/scripts/test_trace_scan.py

      - name: Build
        run: dotnet build APThermo.sln --configuration Release

      - name: Fast test suite
        env:
          APTHERMO_NO_CUDA: '1'
        run: dotnet test APThermo.sln --configuration Release --no-build --filter "Category!=LongRunning"

      # Mirrors ci.yml's build job: every *.actual.txt/*.fields.txt of a fast-suite failure
      # (tests/Harness/BOOT.md, "a field dump is a caller's opt-in").
      - name: Upload bit-snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bit-snapshot-diagnostics-${{ matrix.os }}
          path: |
            **/*.actual.txt
            **/*.actual.json
            **/*.fields.txt
          if-no-files-found: ignore

  cuda-windows:
    name: CUDA (Windows GPU)
    needs: matrix
    runs-on: ['self-hosted', 'windows', 'gpu']
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preflight
        uses: ./.github/actions/preflight

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

      - name: Build
        shell: powershell
        run: dotnet build APThermo.sln --configuration Release

      - name: CUDA tests
        shell: powershell
        run: dotnet test APThermo.sln --configuration Release --no-build --filter "Category=Cuda|Category=BitSnapshot"

  cuda-linux:
    name: CUDA (Linux GPU)
    # Shares one CPU and one GPU with cuda-windows, and the throughput tripwire (root BOOT.md's performance target)
    # measures both, so the two never run at once (the 2026-09-19 post-mortem, "Rehearsal before the tag").
    needs: [matrix, cuda-windows]
    runs-on: ['self-hosted', 'linux', 'gpu']
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preflight
        uses: ./.github/actions/preflight

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

      - name: Build
        shell: bash
        run: dotnet build APThermo.sln --configuration Release

      - name: CUDA tests
        shell: bash
        run: dotnet test APThermo.sln --configuration Release --no-build --filter "Category=Cuda|Category=BitSnapshot"

  pack:
    name: Pack
    needs: [cuda-windows, cuda-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          dotnet pack src/Problems/APThermo.Problems.csproj --configuration Release -p:ContinuousIntegrationBuild=true --output artifacts/packages
          dotnet pack src/Cli/APThermo.Cli.csproj --configuration Release -p:ContinuousIntegrationBuild=true --output artifacts/packages

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages

  publish:
    name: Publish to NuGet
    needs: pack
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  github-release:
    name: Create GitHub Release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Create release
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_REF_NAME" artifacts/packages/* \
            --notes-file release-notes.md \
            --verify-tag
