name: Runner diagnostics
description: >
  Prints the CPU model and the logical core count of this runner and, when the .NET SDK is already set up in this
  job, the ISA facts .NET itself sees (System.Runtime.Intrinsics.X86's Avx2/Fma/Avx512F.IsSupported,
  RuntimeInformation.ProcessArchitecture and .OSDescription): evidence for the CPU-model and JIT-tiering hypotheses
  of the bits-diagnostics task (root BOOT.md's platform constraint; tests/Harness/BOOT.md's per-case field dump).
  One place for the logic every job's first diagnostics step shares, so it cannot drift between jobs.
inputs:
  dotnet-available:
    description: "'true' once this job has already run its own 'Setup .NET SDK' step, so the ISA probe project can run."
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # PowerShell 7 (pwsh) exists only on hosted images; a self-hosted runner has none, so this step and the three
    # below name their shell explicitly and split by OS (the 2026-09-19 post-mortem, root BOOT.md's "Rehearsal
    # before the tag"). Windows PowerShell 5.1 has no $IsWindows, hence the split rather than a single script
    # branching on it.
    - name: CPU model and logical core count (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name)
        Write-Host "CPU model: $cpu"
        Write-Host "Logical cores: $([Environment]::ProcessorCount)"

    - name: CPU model and logical core count (Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cpu=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')
        echo "CPU model: $cpu"
        echo "Logical cores: $(nproc)"

    - name: ISA facts .NET sees (Windows)
      if: runner.os == 'Windows' && inputs.dotnet-available == 'true'
      shell: powershell
      run: dotnet run --project "${{ github.action_path }}/../../diagnostics/IsaProbe" --configuration Release

    - name: ISA facts .NET sees (Linux)
      if: runner.os != 'Windows' && inputs.dotnet-available == 'true'
      shell: bash
      run: dotnet run --project "${{ github.action_path }}/../../diagnostics/IsaProbe" --configuration Release
